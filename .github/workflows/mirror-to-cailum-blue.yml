# Keeps cailum-blue/agentic-sdlc in step with this repo through a sync PR.
# cailum-blue requires a reviewed PR into main and signed commits on every branch, so this cannot
# force-push. Instead, on every push to main it applies scripts/work-mirror-overlay.py (the work
# repo installs from cailum-blue/agentic-sdlc, marketplace name sw-development-process) and
# scripts/sync-to-work-repo.py opens or refreshes one PR from the branch mirror/sync, with a commit
# GitHub signs. A teammate approves and merges it.
# Needs the CAILUM_MIRROR_TOKEN secret: a fine-grained token on cailum-blue/agentic-sdlc only, with
# Contents and Pull requests read and write.
name: Sync to cailum-blue

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-cailum-blue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # the work repo gets the scripts but not this workflow; guard anyway
    if: github.repository == 'mschabow/agentic-sdlc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false

      - name: Check the token
        env:
          MIRROR_TOKEN: ${{ secrets.CAILUM_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::Add the CAILUM_MIRROR_TOKEN secret (Contents and Pull requests read/write on cailum-blue/agentic-sdlc)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: cailum-blue/agentic-sdlc
          ref: main
          path: work
          token: ${{ secrets.CAILUM_MIRROR_TOKEN }}
          persist-credentials: false

      - name: Apply the work-repo overlay
        run: python3 src/scripts/work-mirror-overlay.py

      - name: Open or refresh the sync PR
        env:
          GH_TOKEN: ${{ secrets.CAILUM_MIRROR_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 src/scripts/sync-to-work-repo.py src work
