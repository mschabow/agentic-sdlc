name: crap-tests

on:
  pull_request:
    paths: ["quality/crap/**", ".github/workflows/crap*.yml"]
  push:
    branches: [main]
    paths: ["quality/crap/**", ".github/workflows/crap*.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --require-hashes --no-deps -r quality/crap/requirements.txt
      - run: python -W error::ResourceWarning -m unittest discover -s quality/crap -v
