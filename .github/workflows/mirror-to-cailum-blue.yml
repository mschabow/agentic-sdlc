# Mirrors main to cailum-blue/agentic-sdlc, with one commit on top (scripts/work-mirror-overlay.py) that
# keeps the work repo's install path: cailum-blue/agentic-sdlc, marketplace name sw-development-process.
# Needs the CAILUM_MIRROR_TOKEN secret: a fine-grained token with Contents read and write on
# cailum-blue/agentic-sdlc only.
name: Mirror to cailum-blue

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mirror-to-cailum-blue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    # the mirrored copy carries this file too; never run it there
    if: github.repository == 'mschabow/agentic-sdlc'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the work-repo overlay
        run: |
          git config user.name "agentic-sdlc mirror"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/work-mirror-overlay.py
          git add -A
          git commit -m "Work-repo overlay: install from cailum-blue/agentic-sdlc" -m "Mirror of mschabow/agentic-sdlc@${GITHUB_SHA::7}. Change the personal repo; this commit is rebuilt on every push."

      - name: Push to cailum-blue/agentic-sdlc
        env:
          MIRROR_TOKEN: ${{ secrets.CAILUM_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::Add the CAILUM_MIRROR_TOKEN secret (Contents read/write on cailum-blue/agentic-sdlc)"
            exit 1
          fi
          git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/cailum-blue/agentic-sdlc.git" HEAD:refs/heads/main
